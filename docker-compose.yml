name: samary-local

services:
  postgres:
    image: postgres:16
    container_name: samary-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: samary
    ports:
      - "5437:5432"
    volumes:
      - samary_postgres_data:/var/lib/postgresql/data

volumes:
  samary_postgres_data:
